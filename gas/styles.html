<style>
  :root{
    /* White base + Light Blue accents */
    --bg:#ffffff;
    --surface:#ffffff;
    --text:#0f172a;
    --muted:#64748b;

    --line:#e2e8f0;
    --soft:#f8fafc;

    --accent:#3b82f6;     /* blue */
    --accent2:#60a5fa;    /* light blue */
    --accent3:#93c5fd;    /* pale blue */

    --today:#dbeafe;      /* very light blue */
    --weekend:#fff7ed;    /* subtle warm tint */
    --notes:#f8fafc;
    --danger:#ef4444;
  }

  *{box-sizing:border-box;}
  html, body{
    margin:0;
    overflow-x:hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans JP", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
    background:var(--bg);
    color:var(--text);
  }

  /* Top bar: compressed for maximum calendar space */
  .topbar{
    position: sticky;
    top:0;
    z-index:10;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:8px 10px;
    gap:10px;
    background:rgba(255,255,255,.9);
    backdrop-filter: blur(8px);
    border-bottom:1px solid var(--line);
  }
  .topbar > div:first-child{
    min-width:260px;
  }
  .app-title{font-weight:900; font-size:16px; line-height:1.1; letter-spacing:.2px;}
  .subtle{color:var(--muted); font-size:11px; margin-top:2px; max-width:240px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .topbar__right{display:flex; gap:8px; align-items:center;}

  /* Inline info bar */
  .infobar{
    display:flex;
    align-items:center;
    gap:10px;
    padding:6px 10px;
    border:1px solid var(--line);
    border-radius:14px;
    background:#ffffff;
    white-space:nowrap;
  }
  .infoItem{
    display:flex;
    align-items:baseline;
    gap:6px;
  }
  .infobar .k{
    font-size:11px;
    color:var(--muted);
    font-weight:800;
    letter-spacing:.02em;
  }
  .infobar .v{
    font-size:12px;
    color:var(--text);
    font-weight:950;
  }
  .sep{
    width:1px;
    height:18px;
    background:var(--line);
  }

  .btn{
    border:1px solid var(--line);
    background:#ffffff;
    color:var(--text);
    padding:7px 10px;
    border-radius:12px;
    cursor:pointer;
    font-weight:700;
    transition: background 0.15s, border-color 0.15s;
  }
  .btn:hover{border-color:#cbd5e1; background:var(--soft);}
  .btn:disabled{opacity:0.5; cursor:not-allowed;}
  .btn--primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  .btn--primary:hover:not(:disabled){background:#2563eb; border-color:#2563eb;}
  .btn--danger{background:var(--danger); border-color:var(--danger); color:#fff;}
  .btn--danger:hover:not(:disabled){background:#dc2626; border-color:#dc2626;}
  .btn--ghost{background:transparent;}

  .iconBtn{
    width:36px; height:36px; border-radius:12px;
    background:#ffffff; border:1px solid var(--line);
    color:var(--text); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    font-size:18px;
    transition: background 0.15s;
  }
  .iconBtn:hover{background:var(--soft);}

  /* Calendar area maximize: minimal padding */
  .container{
    padding:6px 8px 12px;
    max-width: 1600px;
    margin:0 auto;
  }

  .board{
    background:#ffffff;
    border:0;
    padding:0;
  }
  .board--full{
    display:flex;
    flex-direction:column;
    gap:16px;
  }

  /* Month grid (Whiteboard style) - 3行統合構造、縦最大化 */
  .monthGrid{
    display: grid;
    /* 月ラベル(64px) + 31日 + 備考(88px) */
    grid-template-columns: 64px repeat(31, minmax(28px, 1fr)) 88px;
    grid-template-rows: auto auto 1fr;
    background: var(--surface);
    border-radius: 16px;
    color: var(--text);
    border: 1px solid var(--line);
    box-shadow: 0 1px 0 rgba(15,23,42,.04);
    min-width: 1180px;
    min-height: calc(100vh - 100px);
  }

  /* 月ラベル：3行統合（grid-row span 3） */
  .monthLabel{
    grid-column: 1;
    grid-row: 1 / span 3;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    font-weight: 1000;
    background: #ffffff;
    border-right: 1px solid var(--line);
    writing-mode: vertical-rl;
    text-orientation: upright;
    letter-spacing: 0.08em;
  }

  /* 共通セルスタイル */
  .cell{
    border-right: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    font-size: 12px;
  }
  .cell:nth-child(33){ border-right: none; } /* 備考列 */

  /* 日付ヘッダー（1行目） */
  .dayHead{
    grid-row: 1;
    background: var(--soft);
    font-weight: 900;
    text-align: center;
    padding: 4px 0;
    min-height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* 曜日ヘッダー（2行目） */
  .wdayHead{
    grid-row: 2;
    background: var(--soft);
    font-weight: 800;
    text-align: center;
    padding: 3px 0;
    min-height: 22px;
    color: #334155;
    font-size: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* 備考ヘッダー（1-2行統合） */
  .notesHead{
    grid-column: 33;
    grid-row: 1 / span 2;
    background: var(--soft);
    font-weight: 900;
    font-size: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-right: none;
    border-bottom: 1px solid var(--line);
  }

  /* 予定セル（3行目）- 2列固定レイアウト */
  .eventsCell{
    grid-row: 3;
    min-height: 280px;
    cursor: pointer;
    background: #fff;
    padding: 0;
    transition: background 0.1s;
    overflow: visible !important;
  }
  .eventsCell:hover{ background: #f9fbff; }
  .eventsCell.not-editable{ cursor: default; background: #fafafa; }

  /* ========================================
     予定表示：セル全面テキスト方式（カード禁止）
     !important で旧CSS強制上書き
     ======================================== */

  /* 予定欄：2列固定、セル内スクロール */
  .dayEvents{
    display: grid !important;
    grid-template-columns: 1fr 1fr !important;
    gap: 10px !important;
    height: 100% !important;
    width: 100% !important;
    padding: 6px !important;
    overflow-y: auto !important;
    overflow-x: hidden !important;
  }

  /* 列 */
  .eventCol{
    min-width: 0 !important;
    display: flex !important;
    flex-direction: column !important;
    gap: 8px !important;
  }

  /* 予定1本：セル直書き風（枠は最小） */
  .eventText{
    writing-mode: vertical-rl !important;
    text-orientation: mixed !important;
    transform: none !important;
    width: 100% !important;
    min-width: 0 !important;
    height: auto !important;
    border: 1px solid rgba(0,0,0,.08) !important;
    border-radius: 10px !important;
    background: #fff !important;
    padding: 10px 6px !important;
    overflow: visible !important;
    cursor: pointer !important;
    flex: 1 !important;
    min-height: 100px !important;
    position: relative !important;
  }
  .eventText:hover{
    background: #f9fbff !important;
    border-color: #dbeafe !important;
  }

  /* 種別色：上の細線だけ（左右帯は禁止） */
  .eventText::before{
    content: "" !important;
    display: block !important;
    position: absolute !important;
    top: 0 !important;
    left: 0 !important;
    right: 0 !important;
    height: 4px !important;
    background: var(--typeColor, #60a5fa) !important;
    border-radius: 10px 10px 0 0 !important;
  }

  /* 縦書きテキスト：全要素を1本のテキストに結合 */
  .eventTextInner{
    font-size: 13px !important;
    font-weight: 700 !important;
    line-height: 1.4 !important;
    color: var(--text) !important;
  }

  /* タイトル部分（太字で強調） */
  .eventTextInner .evTitle{
    font-weight: 950 !important;
  }

  /* 時刻部分（小さめ・薄い色） */
  .eventTextInner .evTime{
    font-size: 11px !important;
    color: var(--muted) !important;
  }

  /* 場所・メモ部分（やや薄い色） */
  .eventTextInner .evSub{
    font-size: 12px !important;
    color: #64748b !important;
  }

  /* 種別ごとの色 */
  .type-MEET, .type-MEETING{ --typeColor: #7c3aed !important; }
  .type-VIP, .type-VISIT{ --typeColor: #f59e0b !important; }
  .type-OUT, .type-TRAVEL{ --typeColor: #10b981 !important; }
  .type-DINNER{ --typeColor: #ec4899 !important; }
  .type-HOLIDAY{ --typeColor: #ef4444 !important; }
  .type-OTHER{ --typeColor: #64748b !important; }

  /* 備考セル（3行目）- 縦書き表示 */
  .notesBody{
    grid-column: 33;
    grid-row: 3;
    background: var(--notes);
    min-height: 180px;
    max-height: 320px;
    padding: 4px;
    overflow: hidden;
    border-right: none;
    border-bottom: 1px solid var(--line);
  }

  /* 備考テキスト - 縦書き */
  .notesText{
    width: 100%;
    height: 100%;
    min-height: 168px;
    resize: none;
    border: 1px dashed var(--line);
    border-radius: 6px;
    padding: 6px 4px;
    font-size: 11px;
    line-height: 1.3;
    background: #ffffff;
    color: var(--text);
    font-family: inherit;
    /* 縦書き */
    writing-mode: vertical-rl;
    text-orientation: mixed;
  }
  .notesText:focus{
    outline: 2px solid var(--accent3);
    border-color: transparent;
  }
  .notesText:disabled{
    background: var(--soft);
    opacity: 0.7;
    cursor: not-allowed;
  }

  /* Weekend / Today */
  .isWeekend{background:var(--weekend);}
  .isSunday .dayHead, .isSunday .wdayHead, .isSunday.dayHead, .isSunday.wdayHead{color:#dc2626;}
  .isSaturday .dayHead, .isSaturday .wdayHead, .isSaturday.dayHead, .isSaturday.wdayHead{color:#2563eb;}
  .isToday{
    outline:3px solid var(--accent2);
    outline-offset:-3px;
    background: var(--today) !important;
  }

  /* Modal: white base, blue accents */
  .modal, .drawer{display:none;}
  .modal[aria-hidden="false"], .drawer[aria-hidden="false"]{display:block;}
  .modal__backdrop, .drawer__backdrop{
    position:fixed; inset:0; background:rgba(15,23,42,.35);
    z-index:20;
  }
  .modal__panel{
    position:fixed; inset:auto 0 0 0;
    max-width:720px; max-height:90vh; margin:0 auto;
    background:#ffffff; color:var(--text);
    border-radius:18px 18px 0 0;
    border:1px solid var(--line);
    z-index:21;
    display:flex; flex-direction:column;
  }
  .modal__header{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px;
    border-bottom:1px solid var(--line);
  }
  .modal__title{font-weight:1000; font-size:1.1rem;}

  .modal__body{padding:16px; overflow-y:auto; flex:1;}
  .formRow{margin-bottom:14px;}
  .formRow label{display:block; font-size:12px; color:var(--muted); margin-bottom:6px; font-weight:600;}
  .formRow .required{color:var(--danger);}
  .formRow input, .formRow select, .formRow textarea{
    width:100%; padding:10px 12px; border-radius:12px;
    border:1px solid var(--line); background:#ffffff; color:var(--text);
    font-size:14px; font-family:inherit;
  }
  .formRow input:focus, .formRow select:focus, .formRow textarea:focus{
    outline:none;
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(59,130,246,0.15);
  }
  .formRow input:disabled, .formRow select:disabled, .formRow textarea:disabled{
    opacity:0.6; cursor:not-allowed; background:var(--soft);
  }
  .formRow.two{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .editHint{font-size:12px; color:var(--muted); padding:8px 0;}
  .editHint.warning{color:#f59e0b;}

  .modal__footer{
    display:flex; align-items:center; gap:8px;
    padding:12px 16px;
    border-top:1px solid var(--line);
  }
  .spacer{flex:1;}

  /* Drawer */
  .drawer__panel{
    position:fixed; top:0; right:0; height:100vh; width:min(860px, 94vw);
    background:#ffffff; color:var(--text);
    border-left:1px solid var(--line);
    z-index:21;
    display:flex; flex-direction:column;
  }
  .drawer__header{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px;
    border-bottom:1px solid var(--line);
  }
  .drawer__title{font-weight:1000; font-size:1.1rem;}
  .drawer__body{padding:16px; overflow:auto; flex:1;}

  .archive-controls{
    display:flex; align-items:flex-end; gap:12px; flex-wrap:wrap;
  }
  .archive-controls label{margin-bottom:0;}
  .archive-controls input{width:auto; min-width:160px;}

  .tableWrap{margin-top:16px; overflow:auto; border:1px solid var(--line); border-radius:12px;}
  .tbl{width:100%; border-collapse:collapse; font-size:12px;}
  .tbl th, .tbl td{border-bottom:1px solid var(--line); padding:10px 12px; text-align:left;}
  .tbl th{position:sticky; top:0; background:var(--soft); font-weight:700;}
  .tbl tbody tr:hover{background:#f8fafc;}

  /* Loading */
  .loading{
    display:none;
    position:fixed; inset:0;
    background:rgba(255,255,255,.8);
    z-index:100;
    justify-content:center; align-items:center;
    flex-direction:column; gap:16px;
  }
  .loading[aria-hidden="false"]{display:flex;}
  .loading__spinner{
    width:48px; height:48px;
    border:4px solid var(--line);
    border-top-color:var(--accent);
    border-radius:50%;
    animation:spin 1s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading__text{font-size:14px; color:var(--text);}

  /* Responsive: optimize for different screen sizes */
  @media (max-width:1400px){
    .monthGrid{
      grid-template-columns: 56px repeat(31, minmax(26px, 1fr)) 80px;
      min-width: 1080px;
    }
  }
  @media (max-width:1200px){
    .monthGrid{
      grid-template-columns: 48px repeat(31, minmax(24px, 1fr)) 72px;
      min-width: 960px;
    }
    .monthLabel{ font-size: 24px; }
  }
  @media (max-width:1100px){
    .infobar{ display: none; }
  }
  @media (max-width:768px){
    .topbar{ flex-direction: column; gap: 10px; align-items: flex-start; }
    .topbar__right{ width: 100%; }
    .formRow.two{ grid-template-columns: 1fr; }
  }
</style>

<style>
  :root{
    /* White base + Light Blue accents */
    --bg:#ffffff;
    --surface:#ffffff;
    --text:#0f172a;
    --muted:#64748b;

    --line:#e2e8f0;
    --soft:#f8fafc;

    --accent:#3b82f6;     /* blue */
    --accent2:#60a5fa;    /* light blue */
    --accent3:#93c5fd;    /* pale blue */

    --today:#dbeafe;      /* very light blue */
    --weekend:#fff7ed;    /* subtle warm tint */
    --notes:#f8fafc;
    --danger:#ef4444;
  }

  *{box-sizing:border-box;}
  html, body{
    margin:0;
    overflow-x:hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans JP", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
    background:var(--bg);
    color:var(--text);
  }

  /* Top bar: compressed for maximum calendar space */
  .topbar{
    position: sticky;
    top:0;
    z-index:10;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:8px 10px;
    gap:10px;
    background:rgba(255,255,255,.9);
    backdrop-filter: blur(8px);
    border-bottom:1px solid var(--line);
  }
  .topbar > div:first-child{
    min-width:260px;
  }
  .app-title{font-weight:900; font-size:16px; line-height:1.1; letter-spacing:.2px;}
  .subtle{color:var(--muted); font-size:11px; margin-top:2px; max-width:240px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .topbar__right{display:flex; gap:8px; align-items:center;}

  /* Inline info bar */
  .infobar{
    display:flex;
    align-items:center;
    gap:10px;
    padding:6px 10px;
    border:1px solid var(--line);
    border-radius:14px;
    background:#ffffff;
    white-space:nowrap;
  }
  .infoItem{
    display:flex;
    align-items:baseline;
    gap:6px;
  }
  .infobar .k{
    font-size:11px;
    color:var(--muted);
    font-weight:800;
    letter-spacing:.02em;
  }
  .infobar .v{
    font-size:12px;
    color:var(--text);
    font-weight:950;
  }
  .sep{
    width:1px;
    height:18px;
    background:var(--line);
  }

  .btn{
    border:1px solid var(--line);
    background:#ffffff;
    color:var(--text);
    padding:7px 10px;
    border-radius:12px;
    cursor:pointer;
    font-weight:700;
    transition: background 0.15s, border-color 0.15s;
  }
  .btn:hover{border-color:#cbd5e1; background:var(--soft);}
  .btn:disabled{opacity:0.5; cursor:not-allowed;}
  .btn--primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  .btn--primary:hover:not(:disabled){background:#2563eb; border-color:#2563eb;}
  .btn--danger{background:var(--danger); border-color:var(--danger); color:#fff;}
  .btn--danger:hover:not(:disabled){background:#dc2626; border-color:#dc2626;}
  .btn--ghost{background:transparent;}

  .iconBtn{
    width:36px; height:36px; border-radius:12px;
    background:#ffffff; border:1px solid var(--line);
    color:var(--text); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    font-size:18px;
    transition: background 0.15s;
  }
  .iconBtn:hover{background:var(--soft);}

  /* Calendar area maximize: minimal padding */
  .container{
    padding:6px 8px 12px;
    max-width: 1600px;
    margin:0 auto;
  }

  .board{
    background:#ffffff;
    border:0;
    padding:0;
  }
  .board--full{
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  /* Month grid (Whiteboard style) */
  .monthGrid{
    background: var(--surface);
    border-radius:16px;
    overflow-x:auto;
    color:var(--text);
    border:1px solid var(--line);
    box-shadow: 0 1px 0 rgba(15,23,42,.04);
  }
  .monthGrid--big{
    /* Bigger footprint */
  }
  .monthGrid--spaced{ margin-top:0; }

  /* Optimized grid for maximum visibility - minimal notes column */
  .gridRow{
    display:grid;
    /* month label + 31 days + notes (minimized) */
    grid-template-columns: 90px repeat(31, minmax(34px, 1fr)) 120px;
    min-width: 1280px;
  }

  .cell{
    border-right:1px solid var(--line);
    border-bottom:1px solid var(--line);
    padding:6px 6px;
    min-height:34px;
    font-size:12px;
  }
  .cell:last-child{
    border-right:none;
  }

  /* Month label */
  .monthLabel{
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:26px;
    font-weight:1000;
    background:#ffffff;
    writing-mode: vertical-rl;
    text-orientation: upright;
    letter-spacing: 0.1em;
  }

  /* Day header bigger */
  .dayHead{
    background:var(--soft);
    font-weight:900;
    text-align:center;
    padding:8px 0 6px;
    min-height:32px;
  }
  .wdayHead{
    background:var(--soft);
    font-weight:800;
    text-align:center;
    padding:6px 0 8px;
    min-height:32px;
    color:#334155;
    font-size:11px;
  }

  /* Events area: optimized for visibility */
  .eventsCell{
    min-height:170px;
    white-space:normal;
    line-height:1.35;
    vertical-align:top;
    cursor:pointer;
    background:#fff;
    transition: background 0.1s;
  }
  .eventsCell:hover{background:#f9fbff;}
  .eventsCell.not-editable{cursor:default; background:#fafafa;}

  /* Event item: blue accent */
  .eventItem{
    padding:5px 7px;
    border-radius:12px;
    margin:4px 0;
    background:#f8fafc;
    border:1px solid #e5e7eb;
    border-left-width:5px;
    cursor:pointer;
    transition: background 0.1s, border-color 0.1s, box-shadow 0.1s;
  }
  .eventItem:hover{background:#eef6ff; border-color:#dbeafe; box-shadow:0 2px 6px rgba(0,0,0,0.08);}
  .eventMeta{font-size:10px; color:#374151; font-weight:800; margin-bottom:2px;}
  .eventTitle{font-size:11px; font-weight:600; word-break:break-all;}

  .notesHead{
    background:var(--soft);
    font-weight:900;
    text-align:center;
    font-size:11px;
  }
  .notesBody{
    background:var(--notes);
    min-height:170px;
    padding:4px;
    overflow:hidden;
  }
  .notesText{
    width:100%;
    height:100%;
    min-height:158px;
    resize:none;
    border:1px dashed var(--line);
    border-radius:8px;
    padding:6px;
    font-size:11px;
    line-height:1.4;
    background:#ffffff;
    color:var(--text);
    font-family:inherit;
  }
  .notesText:focus{
    outline:2px solid var(--accent3);
    border-color:transparent;
  }
  .notesText:disabled{
    background:var(--soft);
    opacity:0.7;
    cursor:not-allowed;
  }

  /* Weekend / Today */
  .isWeekend{background:var(--weekend);}
  .isSunday .dayHead, .isSunday .wdayHead, .isSunday.dayHead, .isSunday.wdayHead{color:#dc2626;}
  .isSaturday .dayHead, .isSaturday .wdayHead, .isSaturday.dayHead, .isSaturday.wdayHead{color:#2563eb;}
  .isToday{
    outline:3px solid var(--accent2);
    outline-offset:-3px;
    background: var(--today) !important;
  }

  /* Modal: white base, blue accents */
  .modal, .drawer{display:none;}
  .modal[aria-hidden="false"], .drawer[aria-hidden="false"]{display:block;}
  .modal__backdrop, .drawer__backdrop{
    position:fixed; inset:0; background:rgba(15,23,42,.35);
    z-index:20;
  }
  .modal__panel{
    position:fixed; inset:auto 0 0 0;
    max-width:720px; max-height:90vh; margin:0 auto;
    background:#ffffff; color:var(--text);
    border-radius:18px 18px 0 0;
    border:1px solid var(--line);
    z-index:21;
    display:flex; flex-direction:column;
  }
  .modal__header{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px;
    border-bottom:1px solid var(--line);
  }
  .modal__title{font-weight:1000; font-size:1.1rem;}

  .modal__body{padding:16px; overflow-y:auto; flex:1;}
  .formRow{margin-bottom:14px;}
  .formRow label{display:block; font-size:12px; color:var(--muted); margin-bottom:6px; font-weight:600;}
  .formRow .required{color:var(--danger);}
  .formRow input, .formRow select, .formRow textarea{
    width:100%; padding:10px 12px; border-radius:12px;
    border:1px solid var(--line); background:#ffffff; color:var(--text);
    font-size:14px; font-family:inherit;
  }
  .formRow input:focus, .formRow select:focus, .formRow textarea:focus{
    outline:none;
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(59,130,246,0.15);
  }
  .formRow input:disabled, .formRow select:disabled, .formRow textarea:disabled{
    opacity:0.6; cursor:not-allowed; background:var(--soft);
  }
  .formRow.two{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .editHint{font-size:12px; color:var(--muted); padding:8px 0;}
  .editHint.warning{color:#f59e0b;}

  .modal__footer{
    display:flex; align-items:center; gap:8px;
    padding:12px 16px;
    border-top:1px solid var(--line);
  }
  .spacer{flex:1;}

  /* Drawer */
  .drawer__panel{
    position:fixed; top:0; right:0; height:100vh; width:min(860px, 94vw);
    background:#ffffff; color:var(--text);
    border-left:1px solid var(--line);
    z-index:21;
    display:flex; flex-direction:column;
  }
  .drawer__header{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px;
    border-bottom:1px solid var(--line);
  }
  .drawer__title{font-weight:1000; font-size:1.1rem;}
  .drawer__body{padding:16px; overflow:auto; flex:1;}

  .archive-controls{
    display:flex; align-items:flex-end; gap:12px; flex-wrap:wrap;
  }
  .archive-controls label{margin-bottom:0;}
  .archive-controls input{width:auto; min-width:160px;}

  .tableWrap{margin-top:16px; overflow:auto; border:1px solid var(--line); border-radius:12px;}
  .tbl{width:100%; border-collapse:collapse; font-size:12px;}
  .tbl th, .tbl td{border-bottom:1px solid var(--line); padding:10px 12px; text-align:left;}
  .tbl th{position:sticky; top:0; background:var(--soft); font-weight:700;}
  .tbl tbody tr:hover{background:#f8fafc;}

  /* Loading */
  .loading{
    display:none;
    position:fixed; inset:0;
    background:rgba(255,255,255,.8);
    z-index:100;
    justify-content:center; align-items:center;
    flex-direction:column; gap:16px;
  }
  .loading[aria-hidden="false"]{display:flex;}
  .loading__spinner{
    width:48px; height:48px;
    border:4px solid var(--line);
    border-top-color:var(--accent);
    border-radius:50%;
    animation:spin 1s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading__text{font-size:14px; color:var(--text);}

  /* Responsive: optimize for different screen sizes */
  @media (max-width:1400px){
    .gridRow{grid-template-columns: 90px repeat(31, minmax(32px, 1fr)) 96px;}
  }
  @media (max-width:1200px){
    .gridRow{grid-template-columns: 80px repeat(31, minmax(30px, 1fr)) 72px;}
    .monthLabel{font-size:22px;}
  }
  @media (max-width:1100px){
    .infobar{display:none;}
  }

  @media (max-width:768px){
    .topbar{flex-direction:column; gap:10px; align-items:flex-start;}
    .topbar__right{width:100%;}
    .formRow.two{grid-template-columns:1fr;}
  }
</style>

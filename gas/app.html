<script>
/**
 * 2ヶ月スケジュール（ホワイトボード形式）- フロントエンドJavaScript
 */

// =============================================================================
// 状態管理
// =============================================================================
const STATE = {
  user: null,
  settings: null,
  masters: null,
  range: null,
  events: [],
  eventById: new Map(),
  notes: {}  // 月ごとの備考 { 'YYYY-MM': 'text' }
};

// モーダル状態
let MODAL_MODE = 'create'; // 'create' | 'edit'
let CURRENT_EVENT_ID = null;

// 保存キュー（バックグラウンド保存用）
const SAVE_QUEUE = [];
let IS_SAVING = false;

// =============================================================================
// ユーティリティ
// =============================================================================

/** 要素取得 */
const el = (id) => document.getElementById(id);

/** 日付をYYYY-MM-DD形式に */
function ymd(d) {
  const year = d.getFullYear();
  const month = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${year}-${month}-${day}`;
}

/** 月を加算 */
function addMonths(dt, n) {
  const d = new Date(dt);
  d.setMonth(d.getMonth() + n);
  return d;
}

/** 月末日を取得 */
function endOfMonth(dt) {
  return new Date(dt.getFullYear(), dt.getMonth() + 1, 0);
}

/** 曜日（日本語） */
function wdayJa(dt) {
  return ['日', '月', '火', '水', '木', '金', '土'][dt.getDay()];
}

/** 今日かどうか */
function isToday(dt) {
  const now = new Date();
  return dt.getFullYear() === now.getFullYear() &&
         dt.getMonth() === now.getMonth() &&
         dt.getDate() === now.getDate();
}

/** HTMLエスケープ */
function esc(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

/** 種別から色を取得 */
function typeColor(code) {
  const t = (STATE.masters?.types || []).find(x => x.code === code);
  return t ? t.color : '#374151';
}

/** 種別ラベルを取得 */
function typeLabel(code) {
  const t = (STATE.masters?.types || []).find(x => x.code === code);
  return t ? t.label : code;
}

/** ステータスラベルを取得 */
function statusLabel(code) {
  const s = (STATE.masters?.statuses || []).find(x => x.code === code);
  return s ? s.label : code;
}

/** 種別からCSSクラスを取得 */
function typeClass_(type) {
  const map = {
    MEET: 'type-MEET',
    MEETING: 'type-MEETING',
    VIP: 'type-VIP',
    VISIT: 'type-VISIT',
    OUT: 'type-OUT',
    TRAVEL: 'type-TRAVEL',
    DINNER: 'type-DINNER',
    HOLIDAY: 'type-HOLIDAY',
    OTHER: 'type-OTHER'
  };
  return map[type] || '';
}

/** 1予定テキストを生成（セル直書き・縦書き・1本テキスト方式） */
function createEventText_(e) {
  const block = document.createElement('div');
  block.className = `eventText ${typeClass_(e.type)}`;

  // 全テキストを1本に結合（縦書きで改行なし＝1列表示）
  const inner = document.createElement('span');
  inner.className = 'eventTextInner';

  // パーツを配列で組み立て
  const parts = [];

  // 時間
  const timeStr = e.start_time
    ? (e.end_time ? `${e.start_time}–${e.end_time}` : e.start_time)
    : '';
  if (timeStr) {
    const sp = document.createElement('span');
    sp.className = 'evTime';
    sp.textContent = timeStr;
    parts.push(sp);
  }

  // 件名（必須・主役）
  const titleStr = (e.title || '').trim() || '(無題)';
  const spTitle = document.createElement('span');
  spTitle.className = 'evTitle';
  spTitle.textContent = titleStr;
  parts.push(spTitle);

  // 場所
  const locStr = (e.location || '').trim();
  if (locStr) {
    const sp = document.createElement('span');
    sp.className = 'evSub';
    sp.textContent = `@${locStr}`;
    parts.push(sp);
  }

  // メモ
  const memoStr = (e.memo || '').trim();
  if (memoStr) {
    const sp = document.createElement('span');
    sp.className = 'evSub';
    sp.textContent = memoStr;
    parts.push(sp);
  }

  // 区切り文字で結合してinnerに追加
  parts.forEach((sp, i) => {
    inner.appendChild(sp);
    if (i < parts.length - 1) {
      inner.appendChild(document.createTextNode('・'));
    }
  });

  block.appendChild(inner);

  // クリック → 編集
  block.addEventListener('click', (ev) => {
    ev.stopPropagation();
    openEditModal(e.event_id);
  });

  return block;
}

// =============================================================================
// GAS通信
// =============================================================================

function showLoading(show) {
  el('loading').setAttribute('aria-hidden', show ? 'false' : 'true');
}

function gas(method, ...args) {
  return new Promise((resolve, reject) => {
    google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(reject)
      [method](...args);
  });
}

// =============================================================================
// トースト通知
// =============================================================================

function showToast(message, type = 'info', duration = 4000) {
  const container = el('toastContainer');
  if (!container) return;

  const icons = {
    success: '✓',
    error: '✗',
    warning: '⚠',
    info: 'ℹ'
  };

  const toast = document.createElement('div');
  toast.className = `toast toast--${type}`;
  toast.innerHTML = `
    <span class="toast__icon">${icons[type] || icons.info}</span>
    <span class="toast__message">${esc(message)}</span>
    <button class="toast__close" type="button">×</button>
  `;

  // 閉じるボタン
  toast.querySelector('.toast__close').addEventListener('click', () => {
    removeToast(toast);
  });

  container.appendChild(toast);

  // 自動削除
  if (duration > 0) {
    setTimeout(() => removeToast(toast), duration);
  }

  return toast;
}

function removeToast(toast) {
  if (!toast || !toast.parentNode) return;
  toast.classList.add('hiding');
  setTimeout(() => toast.remove(), 200);
}

// =============================================================================
// 仮ID生成
// =============================================================================

function generateTempId() {
  return 'tmp-' + crypto.randomUUID();
}

// =============================================================================
// 楽観的UI更新
// =============================================================================

function addEventToUI(event) {
  STATE.events.push(event);
  STATE.eventById.set(event.event_id, event);
  // 並び替え
  STATE.events.sort((a, b) => {
    if (a.date !== b.date) return a.date < b.date ? -1 : 1;
    const at = a.start_time || '99:99';
    const bt = b.start_time || '99:99';
    if (at !== bt) return at < bt ? -1 : 1;
    return (a.display_order || 0) - (b.display_order || 0);
  });
  renderBoards();
}

function updateEventInUI(eventId, updates) {
  const event = STATE.eventById.get(eventId);
  if (!event) return;
  Object.assign(event, updates);
  // 並び替え
  STATE.events.sort((a, b) => {
    if (a.date !== b.date) return a.date < b.date ? -1 : 1;
    const at = a.start_time || '99:99';
    const bt = b.start_time || '99:99';
    if (at !== bt) return at < bt ? -1 : 1;
    return (a.display_order || 0) - (b.display_order || 0);
  });
  renderBoards();
}

function removeEventFromUI(eventId) {
  STATE.events = STATE.events.filter(e => e.event_id !== eventId);
  STATE.eventById.delete(eventId);
  renderBoards();
}

function replaceEventId(oldId, newId) {
  const event = STATE.eventById.get(oldId);
  if (!event) return;
  STATE.eventById.delete(oldId);
  event.event_id = newId;
  STATE.eventById.set(newId, event);
}

// =============================================================================
// バックグラウンド保存キュー
// =============================================================================

function enqueueSave(task) {
  SAVE_QUEUE.push(task);
  processQueue();
}

async function processQueue() {
  if (IS_SAVING || SAVE_QUEUE.length === 0) return;

  IS_SAVING = true;
  const task = SAVE_QUEUE.shift();

  try {
    await task.execute();
  } catch (e) {
    console.error('Background save error:', e);
    if (task.onError) task.onError(e);
  }

  IS_SAVING = false;

  // 次のタスクがあれば処理
  if (SAVE_QUEUE.length > 0) {
    setTimeout(processQueue, 100);
  }
}

// =============================================================================
// 初期化
// =============================================================================

async function boot() {
  showLoading(true);
  try {
    const res = await gas('getBootstrap');

    if (!res.ok) {
      alert('読み込みに失敗しました: ' + (res.error || '不明なエラー'));
      return;
    }

    STATE.user = res.user;
    STATE.settings = res.settings;
    STATE.masters = res.masters;
    STATE.range = res.range;
    STATE.events = res.events || [];
    STATE.eventById = new Map(STATE.events.map(e => [e.event_id, e]));
    STATE.notes = res.notes || {};

    renderHeader();
    renderBoards();
    setupModalMasters();

    console.log('Bootstrap completed:', STATE);
  } catch (e) {
    console.error('Boot error:', e);
    alert('読み込みエラー: ' + e.message);
  } finally {
    showLoading(false);
  }
}

// =============================================================================
// ヘッダー描画
// =============================================================================

function renderHeader() {
  el('userBadge').textContent = STATE.user.email
    ? `ログイン: ${STATE.user.email}`
    : '未ログイン（閲覧のみ）';

  el('baseMonth').textContent = STATE.settings.baseMonth;
  el('editableRange').textContent = `${STATE.range.fromISO} 〜 ${STATE.range.toISO}`;

  const roleLabels = {
    viewer: '閲覧のみ',
    editor: '編集可（直近2ヶ月）',
    admin: '管理者'
  };
  el('role').textContent = roleLabels[STATE.user.role] || STATE.user.role;
}

// =============================================================================
// ホワイトボード描画
// =============================================================================

function renderBoards() {
  const [y, m] = STATE.settings.baseMonth.split('-').map(Number);
  const base = new Date(y, m - 1, 1);

  renderMonthGrid(el('grid1'), base);
  renderMonthGrid(el('grid2'), addMonths(base, 1));
}

/**
 * 月グリッドを描画（CSS Grid ベース - 3行統合構造）
 * 構造: 月ラベル(span 3) | 日付(row1) | 備考ヘッダー(span 2)
 *                        | 曜日(row2) |
 *                        | 予定(row3) | 備考本体(row3)
 */
function renderMonthGrid(container, monthStart) {
  container.innerHTML = '';

  const daysInMonth = endOfMonth(monthStart).getDate();
  const monthLabelText = `${monthStart.getMonth() + 1}月`;

  // 1. 月ラベル（3行統合）
  const monthLabel = document.createElement('div');
  monthLabel.className = 'monthLabel';
  monthLabel.textContent = monthLabelText;
  container.appendChild(monthLabel);

  // 2. 日付ヘッダー（row 1）+ 曜日ヘッダー（row 2）
  for (let day = 1; day <= 31; day++) {
    const dayHead = document.createElement('div');
    dayHead.className = 'cell dayHead';

    const wdayHead = document.createElement('div');
    wdayHead.className = 'cell wdayHead';

    if (day <= daysInMonth) {
      const dt = new Date(monthStart.getFullYear(), monthStart.getMonth(), day);
      const iso = ymd(dt);
      const dayOfWeek = dt.getDay();

      dayHead.textContent = String(day);
      wdayHead.textContent = wdayJa(dt);

      // 週末クラス
      if (dayOfWeek === 0) {
        dayHead.classList.add('isWeekend', 'isSunday');
        wdayHead.classList.add('isWeekend', 'isSunday');
      } else if (dayOfWeek === 6) {
        dayHead.classList.add('isWeekend', 'isSaturday');
        wdayHead.classList.add('isWeekend', 'isSaturday');
      }

      // 今日
      if (isToday(dt)) {
        dayHead.classList.add('isToday');
        wdayHead.classList.add('isToday');
      }

      // 編集可能かどうか
      const canEditDate = isDateEditable(iso);
      const canEditRole = STATE.user.role === 'editor' || STATE.user.role === 'admin';
      const canEdit = canEditDate && canEditRole;

      // 日付・曜日ヘッダークリック → 新規作成
      if (canEdit) {
        dayHead.classList.add('clickable');
        wdayHead.classList.add('clickable');
        dayHead.addEventListener('click', () => openCreateModal(iso));
        wdayHead.addEventListener('click', () => openCreateModal(iso));
      }
    }

    container.appendChild(dayHead);
    container.appendChild(wdayHead);
  }

  // 3. 備考ヘッダー（row 1-2 統合）
  const notesHead = document.createElement('div');
  notesHead.className = 'cell notesHead';
  notesHead.textContent = '備考';
  container.appendChild(notesHead);

  // 4. 予定セル（row 3）
  for (let day = 1; day <= 31; day++) {
    const cell = document.createElement('div');
    cell.className = 'cell eventsCell';

    if (day <= daysInMonth) {
      const dt = new Date(monthStart.getFullYear(), monthStart.getMonth(), day);
      const iso = ymd(dt);
      const dayOfWeek = dt.getDay();

      // 週末・今日のスタイル
      if (dayOfWeek === 0 || dayOfWeek === 6) {
        cell.classList.add('isWeekend');
      }
      if (isToday(dt)) {
        cell.classList.add('isToday');
      }

      // 編集可能かどうか
      const canEditDate = isDateEditable(iso);
      const canEditRole = STATE.user.role === 'editor' || STATE.user.role === 'admin';
      const canEdit = canEditDate && canEditRole;

      if (!canEdit) {
        cell.classList.add('not-editable');
      }

      // セルクリック → 新規作成
      cell.addEventListener('click', (ev) => {
        if (ev.target.closest('.eventText')) return;
        if (canEdit) {
          openCreateModal(iso);
        }
      });

      // その日のイベントを表示（セル直書き・横並び）
      const dayEvents = STATE.events.filter(e => e.date === iso);
      if (dayEvents.length > 0) {
        const dayEventsContainer = document.createElement('div');
        dayEventsContainer.className = 'dayEvents';

        // 予定を直接追加（横並びで左から右へ）
        dayEvents.forEach((e) => {
          const block = createEventText_(e);
          dayEventsContainer.appendChild(block);
        });

        cell.appendChild(dayEventsContainer);
      }
    }

    container.appendChild(cell);
  }

  // 5. 備考セル（row 3、月単位のメモ）
  const notesBody = document.createElement('div');
  notesBody.className = 'cell notesBody';

  const mk = monthKey(monthStart);
  const canEditRole = STATE.user.role === 'editor' || STATE.user.role === 'admin';
  const canEditMonth = isMonthEditable(mk);
  const canEdit = canEditRole && canEditMonth;

  const ta = document.createElement('textarea');
  ta.className = 'notesText';
  ta.placeholder = '備考';
  ta.value = STATE.notes[mk] || '';
  ta.disabled = !canEdit;

  let debounceTimer = null;
  ta.addEventListener('input', () => {
    STATE.notes[mk] = ta.value;

    if (debounceTimer) clearTimeout(debounceTimer);
    debounceTimer = setTimeout(async () => {
      try {
        await gas('upsertNote', mk, ta.value);
      } catch (e) {
        console.error('Note save error:', e);
      }
    }, 600);
  });

  notesBody.appendChild(ta);
  container.appendChild(notesBody);
}

/** 日付が編集可能期間内かどうか */
function isDateEditable(isoDate) {
  if (!STATE.range) return false;
  return isoDate >= STATE.range.fromISO && isoDate <= STATE.range.toISO;
}

/** 月キーを取得（YYYY-MM形式） */
function monthKey(dt) {
  return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}`;
}

/** 翌月キーを取得 */
function nextMonthKey_(baseYYYYMM) {
  const [y, m] = baseYYYYMM.split('-').map(Number);
  const d = new Date(y, m - 1, 1);
  d.setMonth(d.getMonth() + 1);
  return monthKey(d);
}

/** 月キーが編集可能かどうか */
function isMonthEditable(mk) {
  if (!STATE.settings) return false;
  const base = STATE.settings.baseMonth;
  const next = nextMonthKey_(base);
  return mk === base || mk === next;
}

// =============================================================================
// モーダル
// =============================================================================

function setupModalMasters() {
  // 予定種別セレクト
  const typeSel = el('f_type');
  typeSel.innerHTML = '';
  for (const t of (STATE.masters.types || [])) {
    const o = document.createElement('option');
    o.value = t.code;
    o.textContent = `${t.label}（${t.code}）`;
    typeSel.appendChild(o);
  }

  // 状態セレクト
  const statusSel = el('f_status');
  statusSel.innerHTML = '';
  for (const s of (STATE.masters.statuses || [])) {
    const o = document.createElement('option');
    o.value = s.code;
    o.textContent = `${s.label}（${s.code}）`;
    statusSel.appendChild(o);
  }
}

function openModal(open) {
  el('modal').setAttribute('aria-hidden', open ? 'false' : 'true');
  if (open) {
    el('f_title').focus();
  }
}

function applyEditability(dateISO) {
  const canRole = STATE.user.role === 'editor' || STATE.user.role === 'admin';
  const canDate = isDateEditable(dateISO);
  const canEdit = canRole && canDate;

  const fields = ['f_date', 'f_start', 'f_end', 'f_type', 'f_title', 'f_location', 'f_memo', 'f_order', 'f_status'];
  fields.forEach(id => {
    el(id).disabled = !canEdit;
  });

  el('saveBtn').disabled = !canEdit;
  el('deleteBtn').disabled = !canEdit;

  const hint = el('editHint');
  if (canEdit) {
    hint.textContent = 'この期間は編集できます。';
    hint.className = 'editHint';
  } else if (!canRole) {
    hint.textContent = '閲覧権限のため編集できません。';
    hint.className = 'editHint warning';
  } else {
    hint.textContent = '編集可能期間外のため編集できません。';
    hint.className = 'editHint warning';
  }
}

function fillForm(e) {
  el('f_date').value = e.date || '';
  el('f_start').value = e.start_time || '';
  el('f_end').value = e.end_time || '';
  el('f_type').value = e.type || (STATE.masters.types?.[0]?.code || '');
  el('f_title').value = e.title || '';
  el('f_location').value = e.location || '';
  el('f_memo').value = e.memo || '';
  el('f_order').value = (e.display_order ?? '') === '' ? '' : e.display_order;
  el('f_status').value = e.status || 'CONFIRMED';
}

function getPayload() {
  return {
    event_id: CURRENT_EVENT_ID || undefined,
    date: el('f_date').value,
    start_time: el('f_start').value,
    end_time: el('f_end').value,
    type: el('f_type').value,
    title: el('f_title').value,
    location: el('f_location').value,
    memo: el('f_memo').value,
    display_order: el('f_order').value !== '' ? Number(el('f_order').value) : '',
    status: el('f_status').value
  };
}

function openCreateModal(dateISO) {
  MODAL_MODE = 'create';
  CURRENT_EVENT_ID = null;

  el('modalTitle').textContent = '予定追加';
  el('deleteBtn').style.display = 'none';

  fillForm({
    date: dateISO,
    start_time: '',
    end_time: '',
    type: STATE.masters.types?.[0]?.code || '',
    title: '',
    location: '',
    memo: '',
    display_order: '',
    status: 'CONFIRMED'
  });

  applyEditability(dateISO);
  openModal(true);
}

function openEditModal(id) {
  MODAL_MODE = 'edit';
  CURRENT_EVENT_ID = id;

  const e = STATE.eventById.get(id);
  if (!e) return;

  el('modalTitle').textContent = '予定編集';
  el('deleteBtn').style.display = 'inline-block';

  fillForm(e);
  applyEditability(e.date);
  openModal(true);
}

// =============================================================================
// CRUD操作
// =============================================================================

async function refresh() {
  showLoading(true);
  try {
    const res = await gas('listEvents', STATE.range.fromISO, STATE.range.toISO);
    if (!res.ok) {
      alert('再取得失敗: ' + (res.error || ''));
      return;
    }
    STATE.events = res.events || [];
    STATE.eventById = new Map(STATE.events.map(e => [e.event_id, e]));
    renderBoards();
  } catch (e) {
    console.error('Refresh error:', e);
    alert('再取得エラー: ' + e.message);
  } finally {
    showLoading(false);
  }
}

function onSave() {
  const payload = getPayload();

  // クライアント側バリデーション（最低限）
  if (!payload.date) {
    alert('日付を入力してください');
    return;
  }
  if (!payload.type) {
    alert('予定種別を選択してください');
    return;
  }
  if (!payload.title.trim()) {
    alert('件名を入力してください');
    return;
  }

  if (MODAL_MODE === 'create') {
    // ========== 新規作成（ノンブロッキング） ==========
    const tempId = generateTempId();

    // 楽観的UI更新: 仮IDで即座に画面に反映
    const optimisticEvent = {
      event_id: tempId,
      date: payload.date,
      start_time: payload.start_time,
      end_time: payload.end_time,
      type: payload.type,
      title: payload.title,
      location: payload.location,
      memo: payload.memo,
      display_order: payload.display_order,
      status: payload.status,
      _pending: true  // 保存中フラグ
    };
    addEventToUI(optimisticEvent);

    // モーダルを即座に閉じる
    openModal(false);
    showToast('予定を追加しました', 'success', 2000);

    // バックグラウンドで保存
    enqueueSave({
      execute: async () => {
        const res = await gas('createEvent', payload);
        if (res && res.ok) {
          // 仮IDを正式IDに置換
          replaceEventId(tempId, res.event_id);
          const event = STATE.eventById.get(res.event_id);
          if (event) delete event._pending;
          console.log('Background save success:', res.event_id);
        } else {
          // 保存失敗: UIから削除してエラー表示
          removeEventFromUI(tempId);
          const errorMsg = getErrorMessage(res?.error);
          showToast('保存に失敗しました: ' + errorMsg, 'error', 6000);
        }
      },
      onError: (e) => {
        removeEventFromUI(tempId);
        showToast('保存エラー: ' + e.message, 'error', 6000);
      }
    });

  } else {
    // ========== 更新（ノンブロッキング） ==========
    const eventId = CURRENT_EVENT_ID;
    const originalEvent = { ...STATE.eventById.get(eventId) };

    // 楽観的UI更新
    updateEventInUI(eventId, {
      date: payload.date,
      start_time: payload.start_time,
      end_time: payload.end_time,
      type: payload.type,
      title: payload.title,
      location: payload.location,
      memo: payload.memo,
      display_order: payload.display_order,
      status: payload.status,
      _pending: true
    });

    // モーダルを即座に閉じる
    openModal(false);
    showToast('予定を更新しました', 'success', 2000);

    // バックグラウンドで保存
    enqueueSave({
      execute: async () => {
        const res = await gas('updateEvent', eventId, payload);
        if (res && res.ok) {
          const event = STATE.eventById.get(eventId);
          if (event) delete event._pending;
          console.log('Background update success:', eventId);
        } else {
          // 保存失敗: 元に戻してエラー表示
          updateEventInUI(eventId, originalEvent);
          const errorMsg = getErrorMessage(res?.error);
          showToast('更新に失敗しました: ' + errorMsg, 'error', 6000);
        }
      },
      onError: (e) => {
        updateEventInUI(eventId, originalEvent);
        showToast('更新エラー: ' + e.message, 'error', 6000);
      }
    });
  }
}

function getErrorMessage(errorCode) {
  const errorMessages = {
    'AUTH_REQUIRED': '認証が必要です',
    'FORBIDDEN': '編集権限がありません',
    'OUT_OF_EDITABLE_RANGE': '編集可能期間外です',
    'INVALID_DATE': '日付の形式が不正です',
    'TYPE_REQUIRED': '予定種別を選択してください',
    'TITLE_REQUIRED': '件名を入力してください',
    'NOT_FOUND': '予定が見つかりません'
  };
  return errorMessages[errorCode] || errorCode || '不明なエラー';
}

function onDelete() {
  if (!CURRENT_EVENT_ID) return;

  if (!confirm('この予定を削除しますか？')) return;

  const eventId = CURRENT_EVENT_ID;
  const originalEvent = { ...STATE.eventById.get(eventId) };

  // 楽観的UI更新: 即座に画面から削除
  removeEventFromUI(eventId);

  // モーダルを即座に閉じる
  openModal(false);
  showToast('予定を削除しました', 'success', 2000);

  // バックグラウンドで削除
  enqueueSave({
    execute: async () => {
      const res = await gas('deleteEvent', eventId);
      if (res && res.ok) {
        console.log('Background delete success:', eventId);
      } else {
        // 削除失敗: 元に戻してエラー表示
        addEventToUI(originalEvent);
        const errorMsg = getErrorMessage(res?.error);
        showToast('削除に失敗しました: ' + errorMsg, 'error', 6000);
      }
    },
    onError: (e) => {
      addEventToUI(originalEvent);
      showToast('削除エラー: ' + e.message, 'error', 6000);
    }
  });
}

// =============================================================================
// 過去一覧（ドロワー）
// =============================================================================

function openDrawer(open) {
  el('drawer').setAttribute('aria-hidden', open ? 'false' : 'true');
}

async function loadArchive() {
  const m = el('archiveMonth').value;
  if (!m) {
    alert('月を選択してください');
    return;
  }

  showLoading(true);
  try {
    const res = await gas('listArchive', m);

    if (!res.ok) {
      alert('取得失敗: ' + (res.error || ''));
      return;
    }

    const tbody = el('archiveTable').querySelector('tbody');
    tbody.innerHTML = '';

    if (res.events.length === 0) {
      const tr = document.createElement('tr');
      tr.innerHTML = '<td colspan="6" style="text-align:center;color:#6b7280;">予定がありません</td>';
      tbody.appendChild(tr);
      return;
    }

    for (const e of res.events) {
      const tr = document.createElement('tr');
      const timeRange = e.start_time
        ? (e.end_time ? `${e.start_time}–${e.end_time}` : e.start_time)
        : '';
      tr.innerHTML = `
        <td>${esc(e.date)}</td>
        <td>${esc(timeRange)}</td>
        <td>${esc(typeLabel(e.type))}</td>
        <td>${esc(e.title || '')}</td>
        <td>${esc(e.location || '')}</td>
        <td>${esc(statusLabel(e.status))}</td>
      `;
      tbody.appendChild(tr);
    }
  } catch (e) {
    console.error('Archive error:', e);
    alert('取得エラー: ' + e.message);
  } finally {
    showLoading(false);
  }
}

// =============================================================================
// イベントハンドラ設定
// =============================================================================

document.addEventListener('DOMContentLoaded', () => {
  // ヘッダー
  el('reloadBtn').addEventListener('click', boot);
  el('archiveBtn').addEventListener('click', () => openDrawer(true));

  // モーダル
  el('modalClose').addEventListener('click', () => openModal(false));
  el('cancelBtn').addEventListener('click', () => openModal(false));
  el('modalBackdrop').addEventListener('click', () => openModal(false));
  el('saveBtn').addEventListener('click', onSave);
  el('deleteBtn').addEventListener('click', onDelete);

  // 日付変更時に編集可否を再評価
  el('f_date').addEventListener('change', () => {
    applyEditability(el('f_date').value);
  });

  // ドロワー
  el('drawerClose').addEventListener('click', () => openDrawer(false));
  el('drawerBackdrop').addEventListener('click', () => openDrawer(false));
  el('archiveLoad').addEventListener('click', loadArchive);

  // 初期化
  boot();
});
</script>
